name: Update ocean products
on:
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'
permissions:
  contents: write
concurrency:
  group: ocean-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/export.py --download
      - run: python tools/validate.py
      - name: Save products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          git diff --cached --quiet || git commit -m 'Update dated JMA ocean products'
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
